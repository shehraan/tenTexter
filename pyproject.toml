[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ten-texter"
version = "0.1.0"
description = "Local-first messaging coordination agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
ten-texter = "ten_texter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ten_texter"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
